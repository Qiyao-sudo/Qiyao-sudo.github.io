<svg width="400" height="240" viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景层：米色天空与水面基底 -->
  <rect width="400" height="240" fill="#F4F1EC"/>

  <!-- 天空中的大型柔和光晕（日出氛围） -->
  <circle cx="200" cy="140" r="80" fill="#B8A9A0" opacity="0.1"/>
  <circle cx="200" cy="140" r="60" fill="#C4B7A6" opacity="0.15"/>
  <circle cx="200" cy="140" r="40" fill="#B8A9A0" opacity="0.25"/>

  <!-- 旭日本体（刚露出水面一半的状态） -->
  <circle cx="200" cy="140" r="25" fill="#C4B7A6" opacity="0.9"/>



  <!-- 水面 / 远方地平线（柔和的波形轮廓） -->
  <path d="M0 150 Q 100 142 200 150 T 400 150 L400 240 L0 240Z" fill="#9CAF96" opacity="0.08"/>
  <path d="M0 160 Q 150 152 250 162 T 400 158 L400 240 L0 240Z" fill="#7B9E93" opacity="0.12"/>
  <path d="M0 220 Q 100 210 200 215 T 400 220 L400 240 L0 240Z" fill="#C4B7A6" opacity="0.1"/>

  <!-- 水面上的日出倒影（抽象的光斑层） -->
  <ellipse cx="200" cy="160" rx="45" ry="4" fill="#C4B7A6" opacity="0.2"/>
  <ellipse cx="200" cy="175" rx="30" ry="3" fill="#C4B7A6" opacity="0.15"/>
  <ellipse cx="200" cy="190" rx="15" ry="2" fill="#C4B7A6" opacity="0.12"/>
  <ellipse cx="200" cy="210" rx="8" ry="1.5" fill="#C4B7A6" opacity="0.1"/>

  <!-- 湖面细波纹（点缀） -->
  <path d="M 150 165 Q 160 160 170 165" stroke="#9CAF96" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M 230 170 Q 240 165 250 170" stroke="#9CAF96" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M 170 195 Q 180 190 190 195" stroke="#7B9E93" stroke-width="1" fill="none" opacity="0.2"/>
  <path d="M 220 205 Q 230 200 240 205" stroke="#7B9E93" stroke-width="1" fill="none" opacity="0.2"/>

  <!-- 空中漂浮的有机碎片 / 晨曦颗粒（延续原风格） -->
  <ellipse cx="120" cy="80" rx="6" ry="2.5" fill="#9CAF96" opacity="0.25" transform="rotate(-20 120 80)"/>
  <ellipse cx="300" cy="90" rx="8" ry="3" fill="#C4B7A6" opacity="0.2" transform="rotate(15 300 90)"/>
  <ellipse cx="80" cy="130" rx="5" ry="2" fill="#7B9E93" opacity="0.15" transform="rotate(-10 80 130)"/>
  <ellipse cx="320" cy="60" rx="6" ry="2.5" fill="#9CAF96" opacity="0.2" transform="rotate(25 320 60)"/>
  <ellipse cx="90" cy="190" rx="7" ry="2" fill="#B8A9A0" opacity="0.15" transform="rotate(-20 90 190)"/>

</svg>